<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Birthday Quest 🎂</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0C0B1A}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;color:#EDE8F5}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default;opacity:.5}
img{max-width:100%;display:block}

.screen{min-height:100vh;background:linear-gradient(160deg,#0C0B1A 0%,#0D1320 55%,#130A1E 100%)}

.top-nav{position:sticky;top:0;z-index:100;background:rgba(12,11,26,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.nav-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#EDE8F5;flex-shrink:0}
.nav-title{color:#E8C547;font-size:12px;font-weight:600;letter-spacing:.05em;text-align:center;flex:1}
.nav-end{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;color:rgba(237,232,245,.6);font-size:11px;height:38px;white-space:nowrap;display:flex;align-items:center}

.content{max-width:440px;margin:0 auto;padding:20px 14px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.center-content{max-width:440px;margin:0 auto;padding:48px 14px;padding-bottom:calc(40px + env(safe-area-inset-bottom));text-align:center}

.big-emoji{font-size:64px;margin-bottom:14px}
h1{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.2;margin-bottom:8px}
.subtitle{font-size:16px;margin-bottom:6px}
.sub2{font-size:13px;color:rgba(232,197,71,.5);margin-bottom:32px}

.intro-box{background:rgba(232,197,71,.06);border:1px solid rgba(232,197,71,.18);border-radius:16px;padding:18px 20px;margin-bottom:28px;text-align:left}
.intro-box-label{color:#E8C547;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.journey-stop{font-size:14px;margin-bottom:6px;line-height:1.4}
.journey-dim{color:rgba(237,232,245,.28);font-size:14px;margin-bottom:5px;font-style:italic}
.journey-secret{color:rgba(192,132,252,.38);font-size:12px;font-style:italic;margin-top:8px}

.progress-labels{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.progress-label-left{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.progress-label-right{font-size:11px;color:rgba(237,232,245,.3)}
.progress-bar{background:rgba(255,255,255,.08);border-radius:4px;height:3px;margin-bottom:16px}
.progress-fill{border-radius:4px;height:100%;transition:width .4s ease}

.from-label{font-size:11px;margin-bottom:2px}
.teaser{font-size:12px;font-style:italic;color:rgba(237,232,245,.35);margin-bottom:14px}

.puzzle-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:18px 16px;margin-bottom:12px}
.puzzle-card p{font-size:13.5px;line-height:1.65;margin-bottom:8px;color:#EDE8F5}
.puzzle-card p:last-child{margin-bottom:0}
.card-divider{height:1px;background:rgba(255,255,255,.07);margin:12px 0 16px}

.hints-stack{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.hint-box{border-radius:12px;padding:12px 16px}
.hint-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.hint-text{font-size:13px;line-height:1.55;margin:0}

.ghost-btn{width:100%;background:transparent;border-radius:12px;padding:12px 16px;font-size:13px;margin-top:8px;min-height:46px}
.primary-btn{width:100%;border:none;border-radius:14px;padding:15px 20px;font-size:16px;font-weight:700;color:#0C0B1A;margin-top:10px;min-height:50px}

.answer-box{background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.25);border-radius:12px;padding:16px;margin-top:8px}
.answer-main{color:#4ADE80;font-size:16px;font-weight:700;font-family:monospace;margin-bottom:8px}
.answer-reveal{color:#EDE8F5;font-size:13px;line-height:1.65;margin:0}

/* T9 */
.t9-grid{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:4px 0}
.t9-box{border-radius:6px;min-width:32px;padding:6px 8px;text-align:center;font-family:monospace;font-size:14px;font-weight:700}
.t9-space{width:100%;height:8px}

/* WORD SEARCH */
.ws-wrap{overflow-x:auto;text-align:center}
.ws-inner{display:inline-block}
.ws-row{display:flex}
.ws-cell{width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:12px;font-weight:500;color:rgba(237,232,245,.8);border:0.5px solid rgba(255,255,255,.07);border-radius:3px;margin:1px;transition:all .35s}
.ws-cell.hl{font-weight:800;color:#0C0B1A}

/* CAESAR */
.caesar-row{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:8px 0}
.caesar-box{border-radius:6px;width:32px;height:40px;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:17px;font-weight:800}
.caesar-space{width:18px}

/* KOREAN */
.clue-card{border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start}
.clue-icon-wrap{flex-shrink:0;text-align:center;min-width:32px}
.clue-emoji{font-size:16px}
.clue-label-tag{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.clue-text{font-size:13.5px;line-height:1.55;margin:0;color:#EDE8F5}
.instruction-box{margin-top:4px;padding:10px 14px;background:rgba(255,255,255,.03);border-radius:8px}
.instruction-text{font-size:12px;line-height:1.5;font-style:italic}

/* KPOP */
.kpop-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px;padding:8px 10px;border-radius:6px}
.kpop-emoji{font-size:15px;flex-shrink:0}
.kpop-text{font-size:12.5px;line-height:1.45;margin:0;color:#EDE8F5;flex:1}
.blank-display{font-family:monospace;font-size:22px;font-weight:700;letter-spacing:6px;text-align:center;margin:12px 0 0}

/* COMPLETE */
.complete-box{background:rgba(192,132,252,.08);border:1px solid rgba(192,132,252,.3);border-radius:16px;padding:20px 22px;margin-bottom:24px}
.complete-box-title{color:#C084FC;font-size:20px;font-weight:700;margin-bottom:10px}
.complete-box-body{color:#EDE8F5;font-size:14px;line-height:1.7}
.bonus-btn{width:100%;border:none;border-radius:14px;padding:15px 20px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#7C3AED,#4C1D95);margin-top:10px;min-height:50px}

/* END PAGE */
.end-messages{text-align:center;margin-bottom:32px}
.end-msg1{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.3;margin-bottom:24px}
.msg-card{border-radius:16px;padding:18px 20px;margin-bottom:16px;text-align:left}
.msg-card p{font-size:15px;line-height:1.75;margin:0;color:#EDE8F5}
.collage-wrap{margin-bottom:24px;border-radius:20px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.pink-btn{width:100%;border:none;border-radius:14px;padding:15px 20px;font-size:16px;font-weight:700;color:#0C0B1A;background:linear-gradient(135deg,#FF6B9D,#FF6B9DBB);margin-bottom:24px;min-height:50px}
.journey-box{background:rgba(232,197,71,.07);border:1px solid rgba(232,197,71,.2);border-radius:16px;padding:18px 20px}
.journey-box-label{color:#E8C547;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.journey-item{font-size:14px;margin-bottom:8px;line-height:1.4;color:#EDE8F5}

/* GALLERY */
.gallery-nav{position:sticky;top:0;z-index:100;background:rgba(12,11,26,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.07);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.back-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;color:#EDE8F5;font-size:13px;white-space:nowrap}
.gallery-title{color:#E8C547;font-size:14px;font-weight:600}
.photo-grid{columns:2;column-gap:8px;margin-bottom:24px}
.photo-item{break-inside:avoid;margin-bottom:8px}
.photo-item img{width:100%;border-radius:10px}
.no-photos{color:rgba(237,232,245,.4);text-align:center;font-size:14px;padding:40px 0;font-style:italic}
.gold-btn{width:100%;border:none;border-radius:14px;padding:15px 20px;font-size:16px;font-weight:700;color:#0C0B1A;background:linear-gradient(135deg,#E8C547,#E8C547BB);min-height:50px}
</style>
</head>

/* ── STATE ────────────────────────────────────────────── */
function loadState(){
  try{var s=JSON.parse(localStorage.getItem("bq")||"{}");
    return{screen:s.screen||"intro",idx:s.idx||0,hint:s.hint||0,ans:s.ans||false};
  }catch(e){return{screen:"intro",idx:0,hint:0,ans:false};}
}
var S=loadState();
function save(){try{localStorage.setItem("bq",JSON.stringify(S));}catch(e){}}

/* ── MECHANIC RENDERERS ───────────────────────────────── */
function rT9(code,accent){
  return '<div class="t9-grid">'+code.map(function(item){
    if(item==="SPACE") return '<div class="t9-space"></div>';
    return '<div class="t9-box" style="background:'+accent+'18;border:1px solid '+accent+'45;color:'+accent+'">'+item+'</div>';
  }).join('')+'</div>';
}

function rWS(grid,highlights,showAnswer){
  var hl={};
  if(showAnswer) highlights.forEach(function(h){
    for(var c=h.startCol;c<h.startCol+h.length;c++) hl[h.row+","+c]=h.color;
  });
  return '<div class="ws-wrap"><div class="ws-inner">'+
    grid.map(function(row,ri){
      return '<div class="ws-row">'+row.map(function(cell,ci){
        var hc=hl[ri+","+ci];
        if(hc) return '<div class="ws-cell hl" style="background:'+hc+'">'+cell+'</div>';
        return '<div class="ws-cell">'+cell+'</div>';
      }).join('')+'</div>';
    }).join('')+'</div></div>';
}

function rCaesar(encoded,accent){
  return '<div class="caesar-row">'+encoded.map(function(item){
    if(item==="SPACE") return '<div class="caesar-space"></div>';
    return '<div class="caesar-box" style="background:'+accent+'10;border:1px solid '+accent+'40;color:'+accent+'">'+item+'</div>';
  }).join('')+'</div>';
}

function rKorean(clues,instruction,accent){
  return clues.map(function(c){
    return '<div class="clue-card" style="background:'+accent+'0D;border:1px solid '+accent+'35">'+
      '<div class="clue-icon-wrap"><div class="clue-emoji">'+c.emoji+'</div><div class="clue-label-tag" style="color:'+accent+'">'+c.label+'</div></div>'+
      '<p class="clue-text">'+c.text+'</p></div>';
  }).join('')+
  (instruction?'<div class="instruction-box" style="border-left:2px solid '+accent+'60"><p class="instruction-text" style="color:'+accent+'CC">🔊 '+instruction+'</p></div>':'');
}

function rKpop(clues,blank,accent){
  return clues.map(function(c){
    return '<div class="kpop-row" style="background:'+accent+'07;border:0.5px solid '+accent+'20">'+
      '<span class="kpop-emoji">'+c.emoji+'</span><p class="kpop-text">'+c.text+'</p></div>';
  }).join('')+'<p class="blank-display" style="color:'+accent+'">'+blank+'</p>';
}

function rMechanic(m,showAnswer,accent){
  if(!m) return "";
  if(m.type==="t9") return rT9(m.code,accent);
  if(m.type==="wordsearch") return rWS(m.grid,m.highlights,showAnswer);
  if(m.type==="caesar") return rCaesar(m.encoded,accent);
  if(m.type==="korean") return rKorean(m.clues,m.instruction,accent);
  if(m.type==="kpop-cipher") return rKpop(m.clues,m.blank,accent);
  return "";
}

/* ── SCREENS ──────────────────────────────────────────── */
function screenIntro(){

    '<button class="primary-btn" style="background:linear-gradient(135deg,#E8C547,#E8C547BB)" data-action="begin">Begin the Quest ✨</button>'+
    '</div></div>';
}

function screenPuzzle(){
  var isB=S.screen==="bonus";
  var p=isB?BONUS:PUZZLES[S.idx];
  var a=p.accent;
  var pct=isB?100:((S.idx+1)/PUZZLES.length*100);
  var maxH=p.hints?p.hints.length:0;
  var bgGrad=isB?"linear-gradient(90deg,#7C3AED,#C084FC)":"linear-gradient(90deg,"+a+"80,"+a+")";

  var introHTML="";
  if(p.intro){
    p.intro.forEach(function(line){
      if(line==="---") introHTML+='<div style="height:1px;background:rgba(255,255,255,.07);margin:10px 0"></div>';
      else introHTML+='<p>'+line+'</p>';
    });
  }

  var mechanicHTML=rMechanic(p.mechanic,S.ans,a);
  var divider=(p.intro&&p.intro.length>0&&p.mechanic)?'<div class="card-divider"></div>':"";

  var hintsHTML="";
  if(S.hint>0&&p.hints){
    hintsHTML='<div class="hints-stack">';
    for(var i=0;i<S.hint&&i<p.hints.length;i++){
      hintsHTML+='<div class="hint-box" style="background:'+a+'0E;border:1px solid '+a+'30">';
      if(maxH>1) hintsHTML+='<p class="hint-label" style="color:'+a+'">Hint '+(i+1)+'</p>';
      hintsHTML+='<p class="hint-text" style="color:'+a+'">'+p.hints[i]+'</p></div>';
    }
    hintsHTML+='</div>';
  }

  var hintBtn="";
  if(maxH>0&&S.hint<maxH){
    hintBtn='<button class="ghost-btn" style="border:1px solid '+a+'65;color:'+a+'65" data-action="hint">'+(S.hint===0?"💡 Need a hint?":"🤔 One more hint?")+'</button>';
  } else if(maxH>0){
    hintBtn='<button class="ghost-btn" disabled style="border:1px solid rgba(237,232,245,.18);color:rgba(237,232,245,.4)">— no more hints —</button>';
  }

  var ansBtn='<button class="ghost-btn" style="border:1px solid rgba(255,120,120,.45);color:rgba(255,150,150,.8)" data-action="toggle-ans">'+(S.ans?"🙈 Hide Answer":"👀 Reveal Answer — no peeking!")+'</button>';

  var ansBox="",nextBtn="";
  if(S.ans){
    ansBox='<div class="answer-box"><p class="answer-main">'+p.answer+'</p><p class="answer-reveal">'+p.reveal+'</p></div>';
    var nextLabel=isB?"🎉 Happy Birthday!":S.idx<PUZZLES.length-1?"Next Puzzle → ("+(S.idx+2)+" of 5)":"🎉 All Puzzles Solved!";
    var nextBg=isB?"linear-gradient(135deg,#7C3AED,#4C1D95)":"linear-gradient(135deg,"+a+","+a+"BB)";
    var nextColor=isB?"#fff":"#0C0B1A";
    nextBtn='<button class="primary-btn" style="background:'+nextBg+';color:'+nextColor+'" data-action="next">'+nextLabel+'</button>';
  }

  return '<div class="screen">'+
    '<div class="top-nav">'+
    '<button class="nav-btn" data-action="home">🏠</button>'+
    '<span class="nav-title">Birthday Quest</span>'+
    '<button class="nav-end" data-action="jump-end">End ⏭</button>'+
    '</div>'+
    '<div class="content">'+
    '<div class="progress-labels"><span class="progress-label-left" style="color:'+a+'">'+p.emoji+' '+p.label+'</span><span class="progress-label-right">'+p.theme+'</span></div>'+
    '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:'+bgGrad+'"></div></div>'+
    '<p class="from-label" style="color:'+a+'60">📍 From: '+p.from+'</p>'+
    '<p class="teaser">'+p.teaser+'</p>'+
    '<div class="puzzle-card">'+introHTML+divider+mechanicHTML+'</div>'+
    hintsHTML+hintBtn+ansBtn+ansBox+nextBtn+
    '</div></div>';
}

function screenComplete(){
  return '<div class="screen">'+
    '<div class="top-nav"><button class="nav-btn" data-action="home">🏠</button><span class="nav-title">Birthday Quest</span><div style="width:38px"></div></div>'+
    '<div class="center-content">'+
    '<div class="big-emoji">🏆</div>'+
    '<h1 style="color:#E8C547">All 5 Cracked!</h1>'+
    '<p class="subtitle" style="margin-bottom:32px">Completely undefeated.</p>'+
    '<div class="complete-box"><p class="complete-box-title">But wait... 🌙</p><p class="complete-box-body">The massage ends the puzzle chain. But the night itself? Not quite. One final secret destination has been unlocked.</p></div>'+
    '<button class="bonus-btn" data-action="bonus">🎮 Unlock Bonus Round</button>'+
    '</div></div>';
}

function screenEnd(){
  var collage='<div class="collage-wrap"><img id="collage-img" src="photos/collage.jpg" alt="Birthday collage" style="width:100%"></div>';
  return '<div class="screen">'+
    '<div class="top-nav"><button class="nav-btn" data-action="home">🏠</button><span class="nav-title">Birthday Quest</span><div style="width:38px"></div></div>'+
    '<div class="content">'+
    '<div class="end-messages">'+
    '<div class="big-emoji">🎂</div>'+
    '<p class="end-msg1" style="color:#E8C547">Happy birthday beb!</p>'+
    '<div class="msg-card" style="background:rgba(232,197,71,.07);border:1px solid rgba(232,197,71,.2)"><p>Since you are a rabbit, you just turned 2 years old in rabbit years 🐇</p></div>'+
    '<div class="msg-card" style="background:rgba(232,197,71,.07);border:1px solid rgba(232,197,71,.2)"><p>Congrats for solving all the quizzes! 5 puzzles · 1 bonus round · Nokia numbers · word searches · ciphers · Korean phonetics · K-pop first letters · Pokédex entries. You got every single one! Baby can do hard things 👏</p></div>'+
    '</div>'+
    collage+
    '<button class="pink-btn" data-action="gallery">📸 View All Photos</button>'+
    '<div class="journey-box"><p class="journey-box-label">Today\'s journey, unlocked</p>'+
    JOURNEY.map(function(s){return '<p class="journey-item">'+s+'</p>';}).join('')+
    '</div></div></div>';
}

function screenGallery(){
  var photos="";
  for(var i=1;i<=20;i++){
    var src="photos/"+String(i).padStart(2,"0")+".jpg";
    photos+='<div class="photo-item" id="pi'+i+'"><img src="'+src+'" alt="Photo '+i+'" onerror="document.getElementById(\'pi'+i+'\').style.display=\'none\'"></div>';
  }
  return '<div class="screen">'+
    '<div class="gallery-nav"><button class="back-btn" data-action="back-end">← Back</button><p class="gallery-title">📸 Today\'s Photos</p></div>'+
    '<div class="content">'+
    '<div class="photo-grid" id="photo-grid">'+photos+'</div>'+
    '<button class="gold-btn" data-action="back-end">← Back to Birthday Page</button>'+
    '</div></div>';
}

/* ── RENDER ───────────────────────────────────────────── */
function render(){
  var html="";
  if(S.screen==="intro") html=screenIntro();
  else if(S.screen==="puzzle"||S.screen==="bonus") html=screenPuzzle();
  else if(S.screen==="complete") html=screenComplete();
  else if(S.screen==="end") html=screenEnd();
  else if(S.screen==="gallery") html=screenGallery();
  document.getElementById("app").innerHTML=html;

  // Collage error handler (end screen only)
  var ci=document.getElementById("collage-img");
  if(ci) ci.onerror=function(){var w=this.closest(".collage-wrap");if(w) w.style.display="none";};

  // Attach click events via delegation
  document.getElementById("app").onclick=function(e){
    var btn=e.target.closest("[data-action]");
    if(!btn||btn.disabled) return;
    handleAction(btn.dataset.action);
  };
}

/* ── ACTIONS ──────────────────────────────────────────── */
function handleAction(action){
  if(action==="begin"){S.screen="puzzle";}
  else if(action==="home"){
    if(window.confirm("Start over from the beginning?")){
      try{localStorage.removeItem("bq");}catch(e){}
      S={screen:"intro",idx:0,hint:0,ans:false};
    }
  }
  else if(action==="jump-end"){S.screen="end";}
  else if(action==="hint"){S.hint=Math.min(S.hint+1,(S.screen==="bonus"?BONUS:PUZZLES[S.idx]).hints.length);}
  else if(action==="toggle-ans"){S.ans=!S.ans;}
  else if(action==="next"){
    var isB=S.screen==="bonus";
    S.hint=0; S.ans=false;
    if(!isB&&S.idx<PUZZLES.length-1){S.idx++;}
    else if(!isB){S.screen="complete";}
    else{S.screen="end";}
  }
  else if(action==="bonus"){S.screen="bonus";S.hint=0;S.ans=false;}
  else if(action==="gallery"){S.screen="gallery";}
  else if(action==="back-end"){S.screen="end";}
  save();
  render();
}

/* ── INIT ─────────────────────────────────────────────── */
render();
</script>
